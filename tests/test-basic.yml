name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}

      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RUN_ID: ${{ steps.action.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.action.outputs.run_attempt }}
          RUN_NUMBER: ${{ steps.action.outputs.run_number }}
        run: |
          echo "outcome: $OUTCOME"
          echo "run_id: $RUN_ID"
          echo "run_attempt: $RUN_ATTEMPT"
          echo "run_number: $RUN_NUMBER"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RUN_ID" ]; then
              echo "FAIL: action succeeded but run_id output is empty"
              exit 1
            fi
            if [ -z "$RUN_ATTEMPT" ]; then
              echo "FAIL: action succeeded but run_attempt output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with run_id='$RUN_ID' run_attempt='$RUN_ATTEMPT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
