name: Test job context outputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}

      - name: Assert job context outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JOB_NAME: ${{ steps.action.outputs.job_name }}
          JOB_CHECK_RUN_ID: ${{ steps.action.outputs.job_check_run_id }}
          JOB_HTML_URL: ${{ steps.action.outputs.job_html_url }}
          RUN_HTML_URL: ${{ steps.action.outputs.run_html_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "job_name: $JOB_NAME"
          echo "job_check_run_id: $JOB_CHECK_RUN_ID"
          echo "job_html_url: $JOB_HTML_URL"
          echo "run_html_url: $RUN_HTML_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JOB_NAME" ]; then
              echo "FAIL: action succeeded but job_name output is empty"
              exit 1
            fi
            if [ -z "$RUN_HTML_URL" ]; then
              echo "FAIL: action succeeded but run_html_url output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with job_name='$JOB_NAME' run_html_url='$RUN_HTML_URL'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
