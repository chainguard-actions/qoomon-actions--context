name: Test runner context outputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}

      - name: Assert runner context outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RUNNER_NAME: ${{ steps.action.outputs.runner_name }}
          RUNNER_ID: ${{ steps.action.outputs.runner_id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "runner_name: $RUNNER_NAME"
          echo "runner_id: $RUNNER_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RUNNER_NAME" ]; then
              echo "FAIL: action succeeded but runner_name output is empty"
              exit 1
            fi
            if [ -z "$RUNNER_ID" ]; then
              echo "FAIL: action succeeded but runner_id output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with runner_name='$RUNNER_NAME' runner_id='$RUNNER_ID'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
